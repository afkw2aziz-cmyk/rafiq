name: pixel_companion
description: "PixelCompanion — an original LOOI-inspired on-device AI companion for Pixel phones."
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ">=2.6.1 <3.0.0"
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  flutter_tts: ">=4.0.0 <5.0.0"
  speech_to_text: ">=7.0.0 <8.0.0"
  flutter_local_notifications: ">=18.0.0 <21.0.0"
  timezone: ^0.10.0
  permission_handler: ">=11.3.1 <12.0.0"
  battery_plus: ">=6.0.0 <8.0.0"
  flutter_secure_storage: ^9.2.2
  workmanager: ">=0.5.2 <0.7.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
